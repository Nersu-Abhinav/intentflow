name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: node --check backend/server.js
      - run: node --check backend/airwallex.js
      - run: node --check backend/financialEngine.js
      - run: node --check backend/policyEngine.js
      - run: node --check frontend/app.js
